project_id = "potala_portal_local"

[functions.submit-appointment-request]
# Chaves publicáveis não são JWTs. O wrapper valida a chave em `apikey`.
verify_jwt = false

[functions.issue-appointment-room-token]
# Funcao para usuario autenticado: a plataforma valida o JWT antes do handler
# (recomendacao atual do Supabase) e o banco valida de novo ao chamar a RPC.
verify_jwt = true

[functions.close-appointment-room]
  # Encerra a sala: banco autoriza com o JWT do usuario; provedor so e chamado depois.
  verify_jwt = true

[functions.sweep-appointment-rooms]
# Chamada so por agendador (pg_cron/pg_net). Chaves sb_secret_* nao sao JWT, entao a plataforma nao pode
# valida-las; o handler confere a credencial de servico (apikey/Bearer contra SUPABASE_SECRET_KEYS e a chave
# legada) em tempo constante, antes de qualquer acao, e nega tudo se nenhuma chave estiver configurada.
verify_jwt = false
