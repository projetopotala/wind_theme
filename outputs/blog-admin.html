<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#12100e">
  <title>Potala — Mesa do Caderno</title>
  <link rel="icon" href="media/potala-mark-transparent.png">
  <link rel="stylesheet" href="css/blog-admin.css">
  <script src="vendor/supabase.js"></script>
  <script type="module" src="js/blog-admin/blog-admin-entry.js"></script>
</head>
<body>
  <main class="mesa" id="blog-admin-app" data-auth-state="checking">
    <section class="mesa-entrada" data-admin-auth-view aria-labelledby="login-title">
      <img class="mesa-entrada__marca" src="media/potala-mark-transparent.png" alt="Instituto Potala" width="96" height="78">
      <p class="mesa-entrada__sobre">Caderno de Travessia</p>
      <h1 id="login-title">Mesa do Caderno</h1>
      <p class="mesa-entrada__texto">Escreva, publique e acompanhe quem leu e comentou.</p>
      <form data-admin-auth-form hidden>
        <label>E-mail<input name="email" type="email" autocomplete="username" required></label>
        <label>Senha<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="mesa-botao mesa-botao--principal" type="submit">Entrar</button>
        <button class="mesa-link" type="button" data-admin-recovery>Primeiro acesso ou esqueci a senha</button>
      </form>
      <button class="mesa-botao mesa-botao--principal" type="button" data-blog-continue hidden>Continuar para a mesa</button>
      <p class="mesa-entrada__aviso" data-admin-forbidden hidden>Esta conta não tem acesso à mesa do Blog.</p>
      <p class="mesa-entrada__status" data-admin-auth-status role="status" aria-live="polite">Verificando acesso…</p>
      <div class="mesa-entrada__rodape">
        <button type="button" class="mesa-link" data-blog-teste>Ver o acesso de teste</button>
        <a class="mesa-link" href="blog.html">Ver o Blog público</a>
      </div>
    </section>

    <section id="admin-panel" class="mesa-app" hidden>
      <header class="mesa-barra-movel">
        <button type="button" class="mesa-botao-icone" data-mesa-gaveta aria-expanded="false" aria-controls="mesa-trilho">
          <svg class="mesa-icone" aria-hidden="true" focusable="false"><use href="media/icones-admin.svg#menu"></use></svg><span class="sr-only">Abrir o menu</span>
        </button>
        <a class="mesa-barra-movel__marca" href="#/visao"><img src="media/potala-mark-transparent.png" alt="" width="30" height="24"><span>Mesa do Caderno</span></a>
        <a class="mesa-botao mesa-botao--principal mesa-botao--pequeno" href="#/novo">
          <svg class="mesa-icone" aria-hidden="true" focusable="false"><use href="media/icones-admin.svg#plus"></use></svg>Novo
        </a>
      </header>

      <nav class="mesa-trilho" id="mesa-trilho" data-mesa-trilho aria-label="Mesa do Caderno">
        <a class="mesa-trilho__marca" href="#/visao"><img src="media/potala-mark-transparent.png" alt="Mesa do Caderno — início" width="44" height="36"></a>
        <div class="mesa-trilho__links">
          <a href="#/visao" data-mesa-nav="visao"><svg class="mesa-icone" aria-hidden="true" focusable="false"><use href="media/icones-admin.svg#layout-dashboard"></use></svg><span>Visão geral</span></a>
          <a href="#/posts" data-mesa-nav="posts"><svg class="mesa-icone" aria-hidden="true" focusable="false"><use href="media/icones-admin.svg#file-text"></use></svg><span>Posts</span></a>
          <a href="#/comentarios" data-mesa-nav="comentarios"><svg class="mesa-icone" aria-hidden="true" focusable="false"><use href="media/icones-admin.svg#message-circle"></use></svg><span>Comentários</span><span class="mesa-trilho__selo" data-mesa-selo-comentarios hidden></span></a>
          <a href="#/configuracoes" data-mesa-nav="configuracoes"><svg class="mesa-icone" aria-hidden="true" focusable="false"><use href="media/icones-admin.svg#settings"></use></svg><span>Configurações</span></a>
        </div>
        <div class="mesa-trilho__pe">
          <a class="mesa-trilho__novo" href="#/novo" data-mesa-novo title="Novo post"><svg class="mesa-icone" aria-hidden="true" focusable="false"><use href="media/icones-admin.svg#plus"></use></svg><span>Novo post</span></a>
          <button type="button" data-mesa-paleta-abrir title="Comandos (Ctrl+K)"><svg class="mesa-icone" aria-hidden="true" focusable="false"><use href="media/icones-admin.svg#command"></use></svg><span>Comandos</span></button>
          <a href="blog.html" target="_blank" rel="noopener" title="Ver o Blog"><svg class="mesa-icone" aria-hidden="true" focusable="false"><use href="media/icones-admin.svg#external-link"></use></svg><span>Ver o Blog</span></a>
          <span class="mesa-perfil" data-mesa-perfil aria-hidden="true"></span>
          <button type="button" data-admin-sign-out title="Sair"><svg class="mesa-icone" aria-hidden="true" focusable="false"><use href="media/icones-admin.svg#log-out"></use></svg><span>Sair</span></button>
        </div>
      </nav>
      <div class="mesa-veu" data-mesa-veu aria-hidden="true"></div>

      <div class="mesa-conteudo" data-mesa-conteudo>
        <section class="mesa-tela" data-mesa-view="visao" aria-label="Visão geral"></section>
        <section class="mesa-tela" data-mesa-view="posts" aria-label="Posts" hidden></section>
        <section class="mesa-tela" data-mesa-view="comentarios" aria-label="Comentários" hidden></section>
        <section class="mesa-tela" data-mesa-view="configuracoes" aria-label="Configurações" hidden></section>
        <section class="mesa-tela mesa-tela--editor" data-mesa-view="editor" data-blog-editor aria-label="Editor" hidden></section>
      </div>

      <div class="mesa-avisos" data-mesa-avisos></div>
      <dialog class="mesa-dialogo" data-mesa-confirmar aria-label="Confirmação"></dialog>
      <dialog class="mesa-dialogo mesa-paleta" data-mesa-paleta aria-label="Comandos"></dialog>
      <dialog class="mesa-dialogo mesa-dialogo--largo" data-mesa-biblioteca aria-label="Biblioteca de imagens"></dialog>
      <div class="mesa-menu" data-mesa-menu role="menu" hidden></div>
    </section>
  </main>
</body>
</html>
