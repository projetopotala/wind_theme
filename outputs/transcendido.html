<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#edf6fb">
  <title>Instituto Potala</title>
  <script>document.documentElement.classList.add("js");</script>
  <link rel="stylesheet" href="secoes.css">
  <script src="secoes.js" defer></script>
</head>
<body data-section="inicio" data-entry="center" data-has-intro="true" data-story-page="true">
  <section class="welcome-view story-opening" id="inicio" data-story-section="inicio" aria-label="Bem-vindo">
    <div class="opening-panel">
      <div class="opening-halo" aria-hidden="true"></div>
      <h1 class="page-title fold-text" data-fold-text="Bem-vindo.">Bem-vindo.</h1>
      <button class="down-hint" type="button" data-scroll-to="atendimentos" aria-label="Descer para Atendimentos">↓</button>
    </div>
  </section>

  <main class="story-flow" aria-label="Seções do Instituto Potala">
    <section class="story-chapter story-chapter--left" id="atendimentos" data-story-section="atendimentos" data-scroll-path="diagonal-up-right">
      <div class="chapter-stage">
        <div class="environment-panel">
          <span class="chapter-index" aria-hidden="true">01</span>
          <span class="chapter-orbit chapter-orbit--wide" aria-hidden="true"></span>
          <h2 class="chapter-title">Atendimentos</h2>
        </div>
      </div>
    </section>

    <section class="story-chapter story-chapter--right story-chapter--cool" id="atividades" data-story-section="atividades" data-scroll-path="down">
      <div class="chapter-stage">
        <div class="environment-panel">
          <span class="chapter-index" aria-hidden="true">02</span>
          <span class="chapter-orbit" aria-hidden="true"></span>
          <h2 class="chapter-title">Atividades</h2>
        </div>
      </div>
    </section>

    <section class="story-chapter story-chapter--center story-chapter--light" id="cursos" data-story-section="cursos" data-scroll-path="left">
      <div class="chapter-stage">
        <div class="environment-panel">
          <span class="chapter-index" aria-hidden="true">03</span>
          <span class="chapter-orbit chapter-orbit--wide" aria-hidden="true"></span>
          <h2 class="chapter-title">Cursos</h2>
        </div>
      </div>
    </section>

    <section class="story-chapter story-chapter--left story-chapter--deep" id="programacao" data-story-section="programacao" data-scroll-path="diagonal-down-right">
      <div class="chapter-stage">
        <div class="environment-panel">
          <span class="chapter-index" aria-hidden="true">04</span>
          <span class="chapter-orbit" aria-hidden="true"></span>
          <h2 class="chapter-title">Programação</h2>
        </div>
      </div>
    </section>

    <section class="story-chapter story-chapter--right story-chapter--mist" id="saude-integrativa" data-story-section="saude-integrativa" data-scroll-path="up-left">
      <div class="chapter-stage">
        <div class="environment-panel">
          <span class="chapter-index" aria-hidden="true">05</span>
          <span class="chapter-orbit chapter-orbit--wide" aria-hidden="true"></span>
          <h2 class="chapter-title chapter-title--long">Saúde Integrativa</h2>
        </div>
      </div>
    </section>

    <section class="story-chapter story-chapter--center story-chapter--final" id="cultura" data-story-section="cultura" data-scroll-path="arc-right">
      <div class="chapter-stage">
        <div class="environment-panel">
          <span class="chapter-index" aria-hidden="true">06</span>
          <span class="chapter-orbit" aria-hidden="true"></span>
          <h2 class="chapter-title">Cultura</h2>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
