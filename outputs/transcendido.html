  <!--
    A paisagem sai do `body` e vira ELEMENTO.
    Um `background-attachment: fixed` não pode ser animado, e a travessia
    precisa deslocá-la horizontalmente. Em repouso este elemento pinta
    exatamente o que o body pintava, então nada muda visualmente até alguém
    abrir um bloco. Ele é uma camada só: a cena nunca é trocada por outra.
  -->
  <div class="journey-landscape" id="journey-landscape" aria-hidden="true">
    <!--
      A paisagem é uma CENA, e rolar a página caminha por ela.

      O canvas vive dentro da paisagem porque a travessia desloca esse elemento
      para o lado quando um bloco abre, e ele é de propósito mais largo que a
      tela para a borda nunca aparecer. Um canvas irmão, fixo por conta própria,
      ficaria parado enquanto a cena anda.

      O modelo não é pedido aqui: são 9,4 MB, e no HTML eles disputariam banda
      com o que a pessoa precisa ver primeiro. Quem o carrega é o
      `landscape-scene.js`, depois de decidir se vale — no telefone, com
      movimento reduzido, em conexão medida ou sem WebGL ele nunca chega a ser
      pedido, e o fundo segue sendo a webp que está por trás.
    -->
    <canvas class="journey-landscape-scene" aria-hidden="true"></canvas>
  </div>
  <canvas class="journey-road journey-path" id="journey-road" aria-hidden="true"></canvas>
  <div class="journey-scroll-cue" aria-hidden="true"><span></span></div>
