  <script>

<body data-story-page="true">
  <a class="skip-link" href="#journey-root">Ir para a jornada</a>
  <!--
    A paisagem sai do `body` e vira ELEMENTO.
    Um `background-attachment: fixed` não pode ser animado, e a travessia
    precisa deslocá-la horizontalmente. Em repouso este elemento pinta
    exatamente o que o body pintava, então nada muda visualmente até alguém
    abrir um bloco. Ele é uma camada só: a cena nunca é trocada por outra.
  -->
  <div class="journey-landscape" id="journey-landscape" aria-hidden="true">
    <!--
      O vídeo anda com a rolagem: descer adianta a câmera, subir rebobina.

      Ele vive DENTRO da paisagem porque a travessia desloca esse elemento para o
      lado quando um bloco abre, e ele é de propósito mais largo que a tela para
      a borda nunca aparecer. Um vídeo irmão, fixo por conta própria, ficaria
      parado enquanto a cena anda.

      O endereço está em `data-src`, e não em `src`: assim o navegador não gasta
      banda com sete megabytes enquanto ainda desenha o que a pessoa precisa ver
      primeiro. Quem o promove a `src` é o `landscape-video.js`, depois de
      decidir se vale — no telefone, com movimento reduzido ou em conexão
      medida, ele nunca chega a ser pedido, e o fundo segue sendo a webp que já
      está por trás.
    -->
    <video class="journey-landscape-video" data-src="media/home-travessia.mp4"
      muted playsinline preload="none" aria-hidden="true" tabindex="-1"></video>
  </div>
  <canvas class="journey-road journey-path" id="journey-road" aria-hidden="true"></canvas>
  <div class="journey-entry-veil" id="journey-entry-veil" aria-hidden="true"></div>
