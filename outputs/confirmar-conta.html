<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efe4d3">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Confirmação segura da conta do Portal Potala.">
  <title>Confirmação de conta — Instituto Potala</title>
  <link rel="stylesheet" href="/css/confirmar-conta.css">
  <script src="/vendor/supabase.js"></script>
  <script type="module" src="/js/conta/confirmar-conta.js"></script>
</head>
<body class="confirmacao-body">
  <a class="confirmacao-pular" href="#conteudo">Ir para o conteúdo</a>
  <header class="confirmacao-topo">
    <a class="confirmacao-marca" href="/transcendido.html" aria-label="Instituto Potala — início">
      <img src="/media/potala-mark-transparent.png" alt="" width="78" height="64">
      <span>Instituto Potala</span>
    </a>
  </header>

  <main id="conteudo" class="confirmacao-palco">
    <section class="confirmacao-cartao" data-confirmacao data-status="carregando" aria-labelledby="confirmacao-titulo">
      <div class="confirmacao-selo" aria-hidden="true">
        <svg viewBox="0 0 64 64" focusable="false">
          <circle cx="32" cy="32" r="29"></circle>
          <path data-icone-sucesso d="m19 33 8 8 18-20"></path>
          <path data-icone-erro d="M32 18v19m0 9h.01"></path>
        </svg>
      </div>
      <p class="confirmacao-sobretitulo">Seu espaço no Potala</p>
      <h1 id="confirmacao-titulo" data-confirmacao-titulo>Confirmando seu e-mail</h1>
      <p class="confirmacao-texto" data-confirmacao-status role="status" aria-live="polite">Só um instante enquanto validamos seu acesso ao Portal Potala.</p>
      <div class="confirmacao-acoes">
        <a class="confirmacao-botao" href="/meu-potala" data-confirmacao-acao hidden>Entrar no Meu Potala</a>
        <a class="confirmacao-link" href="/transcendido.html">Voltar ao portal</a>
      </div>
    </section>
  </main>

  <footer class="confirmacao-rodape">Instituto Cultural Potala · Indaiatuba, SP</footer>
</body>
</html>
