<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#211b15">
  <meta name="description" content="Um espaço de chegada antes de entrar no Ecossistema Potala.">
  <title>Potala — Chegada</title>
  <!-- Um preload por recorte, com a MESMA media query do <picture> abaixo.
       Sem a query, o telefone baixaria a paisagem inteira além do recorte que
       vai usar — dois arquivos, um deles jogado fora, na coisa mais pesada e
       mais prioritária da página. -->
  <link rel="preload" href="media/chegada.webp" as="image" type="image/webp"
    media="(min-width: 721px)" fetchpriority="high">
  <link rel="preload" href="media/chegada-mobile.webp" as="image" type="image/webp"
    media="(max-width: 720px)" fetchpriority="high">
  <link rel="stylesheet" href="respiracao.css">
  <link rel="stylesheet" href="css/chegada-scene.css">
  <script>
    // O palácio fecha o véu antes de sair, mas esta página abria em brilho
    // cheio: a volta ao começo virava corte. Marcada antes da primeira pintura,
    // a Chegada nasce coberta e o véu se abre revelando o vale — a travessia
    // fecha o círculo com as duas metades casadas.
    //
    // Inline e sem `defer` de propósito: depois do primeiro quadro já seria
    // tarde, e o piscar que se quer evitar já teria acontecido.
    try {
      const chave = "potala.travessia.v1";
      const handoff = JSON.parse(sessionStorage.getItem(chave) || "{}");
      if (["scroll", "drag", "keyboard"].includes(handoff.entry)) {
        document.documentElement.classList.add("entry-pending");
        delete handoff.entry;
        sessionStorage.setItem(chave, JSON.stringify(handoff));
      }
    } catch {}
  </script>
  <script type="module" src="respiracao.js"></script>
  <script type="module" src="js/chegada/arrival-plate-controller.js"></script>
</head>
<body>
  <main class="arrival" id="arrival">
    <section class="arrival-sticky" aria-label="Chegada ao Instituto Potala">
      <div class="arrival-visual" id="arrival-visual">
        <picture class="arrival-plate">
          <!-- No telefone o quadro é vertical: a paisagem inteira encolhida
               deixaria o caminho, que é o assunto, pequeno demais para se ler.
               O recorte retrato nasce do mesmo ponto focal (58% da largura). -->
          <source media="(max-width: 720px)" srcset="media/chegada-mobile.webp"
            width="744" height="992">
          <img src="media/chegada.webp" alt="Paisagem contemplativa do caminho de chegada ao Instituto Potala"
            width="1586" height="992" fetchpriority="high" decoding="async">
        </picture>
        <div class="arrival-atmosphere" aria-hidden="true"></div>
      </div>

      <button class="breath-launcher" id="breath-launcher" type="button"
        aria-controls="breathing-guide" aria-expanded="false">
        <span class="breath-launcher-mark" aria-hidden="true"></span>
        <span>RESPIRAR</span>
      </button>

      <section class="breathing-guide" id="breathing-guide" aria-labelledby="breathing-phase" hidden>
        <button class="breath-close" id="breath-close" type="button" aria-label="Sair da respiração">
          <span aria-hidden="true"></span>
        </button>
        <p class="breathing-kicker">Respiração · Técnica 3-3-3</p>
        <div class="breathing-visual" aria-hidden="true">
          <span class="breathing-ring"></span>
          <div class="breathing-orb" id="breathing-orb">
            <span id="breathing-countdown">3</span>
          </div>
        </div>
        <p class="breathing-phase" id="breathing-phase" aria-live="polite">PREPARE-SE</p>
        <p class="breathing-cycle" id="breathing-cycle">CICLO 0 DE 8</p>
        <div class="breathing-track" aria-label="Progresso da respiração">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="breathing-actions">
          <button id="breathing-restart" type="button" hidden>Recomeçar</button>
          <button id="breathing-start" type="button">Iniciar</button>
          <button id="breathing-stop" type="button" hidden>Pausar</button>
        </div>
      </section>

      <button class="ambient-sound" id="ambient-sound" type="button"
        aria-label="Ativar som ambiente" aria-pressed="false">
        <span class="ambient-sound-bars" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>SOM</span>
      </button>
      <audio id="ambient-audio" src="musica-fundo.mp3" loop preload="none"></audio>

      <div class="journey-scroll-cue" aria-hidden="true">
        <span></span>
      </div>

      <div class="arrival-transition" aria-hidden="true"></div>
    </section>
  </main>

  <noscript>
    <p class="arrival-noscript"><a href="transcendido.html">Entrar no Potala</a></p>
  </noscript>
</body>
</html>
