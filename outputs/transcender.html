<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171a18">
  <meta name="description" content="Um espaço de chegada antes de entrar no Ecossistema Potala.">
  <title>Potala — Chegada</title>
  <link rel="preload" href="media/chegada-landscape.webp" as="image" type="image/webp" fetchpriority="high">
  <link rel="stylesheet" href="respiracao.css">
  <link rel="stylesheet" href="css/chegada-scene.css">
  <script src="respiracao.js" defer></script>
  <script type="module" src="js/chegada/arrival-controller.js"></script>
</head>
<body>
  <main class="arrival" id="arrival">
    <section class="arrival-sticky" aria-label="Chegada ao Instituto Potala">
      <div class="arrival-visual" id="arrival-visual">
        <picture class="arrival-fallback">
          <source media="(max-width: 720px) and (orientation: portrait)"
            srcset="media/chegada-landscape-mobile.webp">
          <img src="media/chegada-landscape.webp" alt="Caminho entre montanhas cobertas por névoa ao amanhecer"
            width="1672" height="941" fetchpriority="high" decoding="async">
        </picture>
        <canvas class="arrival-canvas" id="arrival-scene" aria-hidden="true" hidden></canvas>
        <div class="arrival-atmosphere" aria-hidden="true"></div>
        <div class="arrival-horizon" aria-hidden="true"></div>
      </div>

      <header class="arrival-identity" aria-label="Instituto Potala">
        <span class="arrival-mark" aria-hidden="true"><i></i></span>
        <span>POTALA</span>
      </header>

      <div class="arrival-presence" aria-hidden="true">
        <span>CHEGADA</span>
        <i></i>
      </div>

      <div class="arrival-scroll-cue" aria-hidden="true">
        <span></span>
      </div>

      <div class="arrival-drag" aria-label="Entrada no Ecossistema Potala">
        <button class="transcend-button" id="transcend-button" type="button" role="slider"
          aria-label="Arraste para entrar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <span class="drag-track" aria-hidden="true"></span>
          <span class="drag-thumb" aria-hidden="true"><i></i></span>
        </button>
      </div>

      <div class="arrival-transition" aria-hidden="true"></div>
    </section>
  </main>

  <noscript>
    <p class="arrival-noscript"><a href="transcendido.html">Entrar no Potala</a></p>
  </noscript>
</body>
</html>
